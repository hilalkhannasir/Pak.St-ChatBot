<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pakistan History Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 720px;
      padding: 1.25rem 1rem 0.5rem;
      text-align: center;
    }

    header h1 { font-size: 1.5rem; font-weight: 700; color: #f8fafc; }
    header p  { font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem; }

    #chat-window {
      flex: 1;
      width: 100%;
      max-width: 720px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg {
      max-width: 88%;
      padding: 0.65rem 1rem;
      border-radius: 1rem;
      line-height: 1.55;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #1d4ed8;
      color: #f8fafc;
      border-bottom-right-radius: 0.25rem;
    }

    .msg.assistant {
      align-self: flex-start;
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 0.25rem;
    }

    .msg .source {
      margin-top: 0.4rem;
      font-size: 0.75rem;
      color: #64748b;
    }

    .msg.thinking { font-style: italic; color: #64748b; }

    #input-row {
      width: 100%;
      max-width: 720px;
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem 1.25rem;
    }

    #user-input {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      color: #f1f5f9;
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 2.75rem;
      max-height: 8rem;
      overflow-y: auto;
      line-height: 1.4;
    }

    #user-input:focus { border-color: #3b82f6; }
    #user-input::placeholder { color: #475569; }

    #send-btn {
      background: #1d4ed8;
      border: none;
      border-radius: 0.75rem;
      color: #fff;
      padding: 0 1.1rem;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.15s;
      height: 2.75rem;
    }

    #send-btn:hover  { background: #2563eb; }
    #send-btn:active { background: #1e40af; }
    #send-btn:disabled { background: #1e3a6e; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Pakistan History Chatbot</h1>
    <p>Trained on O-Levels Pakistan Studies History Book</p>
  </header>

  <div id="chat-window"></div>

  <div id="input-row">
    <textarea
      id="user-input"
      placeholder="Ask a question about Pakistan history…"
      rows="1"
    ></textarea>
    <button id="send-btn" title="Send">➤</button>
  </div>

  <script>
    const chatWindow = document.getElementById("chat-window");
    const userInput  = document.getElementById("user-input");
    const sendBtn    = document.getElementById("send-btn");

    function appendMsg(role, text, source) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      if (source) {
        const cap = document.createElement("div");
        cap.className = "source";
        cap.textContent = `Source: ${source}`;
        div.appendChild(cap);
      }
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const query = userInput.value.trim();
      if (!query) return;

      userInput.value = "";
      userInput.style.height = "2.75rem";
      sendBtn.disabled = true;

      appendMsg("user", query);
      const thinking = appendMsg("assistant thinking", "AI is thinking…");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });

        if (!res.ok) throw new Error(`Server error: ${res.status}`);

        const data = await res.json();
        thinking.remove();
        appendMsg("assistant", data.answer, data.source);
      } catch (err) {
        thinking.remove();
        appendMsg("assistant", `Error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    userInput.addEventListener("input", () => {
      userInput.style.height = "2.75rem";
      userInput.style.height = Math.min(userInput.scrollHeight, 128) + "px";
    });
  </script>
</body>
</html>
