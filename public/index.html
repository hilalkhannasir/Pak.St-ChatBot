<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pakistan History Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080c12;
      --surface:     #0d1117;
      --card:        #111820;
      --border:      #1e2a38;
      --border-focus:#2563eb;
      --user-bg:     #1a3a6e;
      --user-text:   #dbeafe;
      --bot-bg:      #131c27;
      --bot-text:    #cbd5e1;
      --muted:       #3d5166;
      --accent:      #2563eb;
      --accent-hover:#3b82f6;
      --text-primary:#e2e8f0;
      --text-sub:    #64748b;
      --scrollbar:   #1e2a38;
    }

    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* ── Outer card ── */
    .chat-card {
      width: 100%;
      max-width: 760px;
      height: min(88vh, 820px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }

    /* ── Header ── */
    .chat-header {
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      flex-shrink: 0;
    }

    .header-icon {
      font-size: 1.4rem;
      line-height: 1;
    }

    .header-text h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }

    .header-text p {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 0.1rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-left: auto;
      flex-shrink: 0;
      box-shadow: 0 0 6px #22c55e88;
    }

    /* ── Messages area ── */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.25rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    #chat-window::-webkit-scrollbar       { width: 5px; }
    #chat-window::-webkit-scrollbar-track { background: transparent; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 99px; }

    /* ── Message bubbles ── */
    .msg-row {
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .avatar.bot  { background: #1e2d42; color: #7aa2d4; border: 1px solid var(--border); }
    .avatar.user { background: #1a3a6e; color: #93c5fd; border: 1px solid #2563eb44; }

    .bubble {
      max-width: 78%;
      padding: 0.7rem 1rem;
      border-radius: 1rem;
      line-height: 1.6;
      font-size: 0.9rem;
      word-break: break-word;
      position: relative;
    }

    .msg-row.user  .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 0.2rem;
      border: 1px solid #2563eb33;
    }

    .msg-row.bot   .bubble {
      background: var(--bot-bg);
      color: var(--bot-text);
      border-bottom-left-radius: 0.2rem;
      border: 1px solid var(--border);
    }

    .source-tag {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: var(--text-sub);
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      padding: 0.15rem 0.5rem;
    }

    .source-tag.book   { color: #4ade80; border-color: #166534; }
    .source-tag.web    { color: #60a5fa; border-color: #1e3a5f; }
    .source-tag.error  { color: #f87171; border-color: #7f1d1d; }

    /* Thinking animation */
    .thinking-dots span {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      margin: 0 2px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0);    opacity: 0.4; }
      40%           { transform: translateY(-5px); opacity: 1;   }
    }

    /* ── Welcome state ── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-sub);
      gap: 0.5rem;
      padding-bottom: 2rem;
    }

    .welcome .icon { font-size: 2.5rem; }
    .welcome h2    { font-size: 1rem; color: var(--text-primary); font-weight: 500; }
    .welcome p     { font-size: 0.8rem; max-width: 320px; line-height: 1.5; }

    /* ── Input row ── */
    .input-area {
      padding: 0.9rem 1.1rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 0.45rem 0.45rem 0.45rem 1rem;
      transition: border-color 0.15s;
    }

    .input-row:focus-within { border-color: var(--border-focus); }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      padding: 0.3rem 0;
    }

    #user-input::placeholder { color: var(--muted); }

    #user-input::-webkit-scrollbar       { width: 4px; }
    #user-input::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 99px; }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 0.55rem;
      color: #fff;
      width: 2.2rem;
      height: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    #send-btn:hover   { background: var(--accent-hover); }
    #send-btn:active  { transform: scale(0.93); }
    #send-btn:disabled { background: #1e2a3a; cursor: not-allowed; transform: none; }

    #send-btn svg { width: 15px; height: 15px; fill: currentColor; }

    .hint {
      font-size: 0.68rem;
      color: var(--text-sub);
      text-align: center;
      margin-top: 0.45rem;
    }
  </style>
</head>
<body>

  <div class="chat-card">

    <div class="chat-header">
      <div class="header-icon">🇵🇰</div>
      <div class="header-text">
        <h1>Pakistan History Chatbot</h1>
        <p>O-Level Pakistan Studies · RAG-powered</p>
      </div>
      <div class="status-dot" title="Online"></div>
    </div>

    <div id="chat-window">
      <div class="welcome" id="welcome">
        <div class="icon">📚</div>
        <h2>Ask anything about Pakistan History</h2>
        <p>Covers the Mughal Empire, British rule, the independence movement, and the formation of Pakistan.</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea
          id="user-input"
          placeholder="Ask a question…"
          rows="1"
          aria-label="Your question"
        ></textarea>
        <button id="send-btn" title="Send (Enter)" aria-label="Send">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
      <p class="hint">Enter to send · Shift+Enter for new line</p>
    </div>

  </div>

  <script>
    const chatWindow = document.getElementById("chat-window");
    const welcome    = document.getElementById("welcome");
    const userInput  = document.getElementById("user-input");
    const sendBtn    = document.getElementById("send-btn");

    // In-memory chat history sent to backend for context
    // Format: [{ role: "user"|"assistant", content: "..." }]
    const history = [];
    const MAX_HISTORY = 20; // keep last 20 messages (10 turns)

    // ── Helpers ──────────────────────────────────────────────

    function hideWelcome() {
      if (welcome) welcome.remove();
    }

    function scrollToBottom() {
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function sourceClass(source) {
      if (!source || source === "Error") return "error";
      if (source === "Book") return "book";
      return "web";
    }

    function sourceLabel(source) {
      if (!source || source === "Error") return null;
      if (source === "Book") return "📖 Book";
      if (source === "Internet Search") return "🌐 Web Search";
      return `🌐 ${source}`;
    }

    function appendMessage(role, text, source) {
      hideWelcome();

      const row = document.createElement("div");
      row.className = `msg-row ${role === "user" ? "user" : "bot"}`;

      const avatar = document.createElement("div");
      avatar.className = `avatar ${role === "user" ? "user" : "bot"}`;
      avatar.textContent = role === "user" ? "You" : "AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      if (source && sourceLabel(source)) {
        const tag = document.createElement("div");
        tag.className = `source-tag ${sourceClass(source)}`;
        tag.textContent = sourceLabel(source);
        bubble.appendChild(tag);
      }

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatWindow.appendChild(row);
      scrollToBottom();
      return { row, bubble };
    }

    function appendThinking() {
      hideWelcome();
      const row = document.createElement("div");
      row.className = "msg-row bot";

      const avatar = document.createElement("div");
      avatar.className = "avatar bot";
      avatar.textContent = "AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<div class="thinking-dots"><span></span><span></span><span></span></div>`;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chatWindow.appendChild(row);
      scrollToBottom();
      return row;
    }

    // ── Send logic ────────────────────────────────────────────

    async function sendMessage() {
      const query = userInput.value.trim();
      if (!query) return;

      userInput.value = "";
      userInput.style.height = "auto";
      sendBtn.disabled = true;

      appendMessage("user", query);

      // Add to history before sending
      history.push({ role: "user", content: query });
      if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);

      const thinkingRow = appendThinking();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            // Send all history except the last user message we just added
            // (backend appends the current query itself)
            history: history.slice(0, -1),
          }),
        });

        const data = await res.json();
        thinkingRow.remove();

        if (!res.ok) {
          const detail = data.detail || `Server error ${res.status}`;
          appendMessage("assistant", `Error: ${detail}`);
          sendBtn.disabled = false;
          userInput.focus();
          return;
        }

        appendMessage("assistant", data.answer, data.source);

        // Add assistant reply to history
        history.push({ role: "assistant", content: data.answer });
        if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);

      } catch (err) {
        thinkingRow.remove();
        appendMessage("assistant", `Something went wrong: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    // ── Events ────────────────────────────────────────────────

    sendBtn.addEventListener("click", sendMessage);

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + "px";
    });

    userInput.focus();
  </script>
</body>
</html>
